name: Release verification report

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release assets against the tagged source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          mkdir -p rel && cd rel
          tag="${TAG:-$(gh release view --repo "$REPO" --json tagName -q .tagName)}"
          gh release download "$tag" --repo "$REPO" --pattern '*.apk' --pattern 'SHA256SUMS' || true
          {
            echo "# Release report for $tag"
            echo
            ok=1
            ver=$(sed -n 's/^  versionName: *//p' ../app/apktool.yml | tr -d "'\" ")
            echo "- Source version at this tag: \`$ver\`"
            case "$tag" in *"$ver"*) echo "- Tag matches source version: yes" ;; *) echo "- Tag matches source version: **NO**"; ok=0 ;; esac
            apks=$(ls *.apk 2>/dev/null || true)
            [ -n "$apks" ] && echo "- APK files: $apks" || { echo "- APK files: **none attached**"; ok=0; }
            if [ -f SHA256SUMS ]; then
              if sha256sum -c SHA256SUMS >/tmp/sum.txt 2>&1; then echo "- SHA256SUMS matches the attached APK: yes"; else echo "- SHA256SUMS matches the attached APK: **NO**"; cat /tmp/sum.txt; ok=0; fi
            else
              echo "- SHA256SUMS attached: **NO**"; ok=0
            fi
            for a in $apks; do echo "- \`$a\` SHA-256: \`$(sha256sum "$a" | cut -d' ' -f1)\`"; done
            echo "- Source checks:"
            (cd .. && bash scripts/check-repo.sh >/tmp/check.txt 2>&1) && echo "  - repository checks and unit tests: passed" || { echo "  - repository checks and unit tests: **FAILED**"; ok=0; }
            echo
            [ "$ok" = 1 ] && echo "**Result: OK**" || echo "**Result: problems found**"
            echo "$ok" > /tmp/ok
          } | tee "$GITHUB_STEP_SUMMARY" report.md
          [ "$(cat /tmp/ok)" = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-report
          path: rel/report.md
