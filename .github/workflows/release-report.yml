name: Release verification report

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (e.g. v.1.96); empty = latest release"
        required: false
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag="$TAG_IN"
          [ -n "$tag" ] || tag=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release assets against the tagged source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          mkdir -p rel && cd rel
          tag="${TAG:-$(gh release view --repo "$REPO" --json tagName -q .tagName)}"
          gh release download "$tag" --repo "$REPO" --pattern '*.apk' --pattern 'SHA256SUMS' || true
          {
            echo "# Release report for $tag"
            echo
            ok=1
            ver=$(sed -n 's/^  versionName: *//p' ../app/apktool.yml | tr -d "'\" ")
            echo "- Source version at this tag: \`$ver\`"
            case "$tag" in *"$ver"*) echo "- Tag matches source version: yes" ;; *) echo "- Tag matches source version: **NO**"; ok=0 ;; esac
            apks=$(ls *.apk 2>/dev/null || true)
            [ -n "$apks" ] && echo "- APK files: $apks" || { echo "- APK files: **none attached**"; ok=0; }
            if [ -f SHA256SUMS ]; then
              if sha256sum -c SHA256SUMS >/tmp/sum.txt 2>&1; then echo "- SHA256SUMS matches the attached APK: yes"; else echo "- SHA256SUMS matches the attached APK: **NO**"; cat /tmp/sum.txt; ok=0; fi
            else
              echo "- SHA256SUMS attached: **NO**"; ok=0
            fi
            for a in $apks; do echo "- \`$a\` SHA-256: \`$(sha256sum "$a" | cut -d' ' -f1)\`"; done
            EXPECTED_CERT=b78b45c953b03302d941797170215f6a9f45b1c46c5a923cc2c28de0a241c372
            bt=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
            for a in $apks; do
              if [ -n "$bt" ]; then
                badge=$("$bt/aapt2" dump badging "$a" 2>/dev/null | head -1)
                pkg=$(echo "$badge" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
                vn=$(echo "$badge" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
                vc=$(echo "$badge" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
                srcvc=$(sed -n 's/^  versionCode: *//p' ../app/apktool.yml | tr -d "'\" ")
                echo "- \`$a\` package: \`$pkg\`, versionName: \`$vn\`, versionCode: \`$vc\`"
                [ "$vc" = "$srcvc" ] || { echo "  - APK versionCode ($vc) differs from source versionCode ($srcvc): **NO**"; ok=0; }
                [ "$pkg" = "ro.outyds.app" ] || { echo "  - package name is not ro.outyds.app: **NO**"; ok=0; }
                [ "$vn" = "$ver" ] || { echo "  - APK versionName differs from source version: **NO**"; ok=0; }
                cert=$("$bt/apksigner" verify --print-certs "$a" 2>&1 | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
                echo "  - signing certificate SHA-256: \`$cert\`"
                [ "$cert" = "$EXPECTED_CERT" ] && echo "  - matches the certificate of earlier releases: yes" || { echo "  - matches the certificate of earlier releases: **NO**"; ok=0; }
                "$bt/zipalign" -c -P 16 4 "$a" >/dev/null 2>&1 || "$bt/zipalign" -c 4 "$a" >/dev/null 2>&1 && echo "  - zip alignment: ok" || { echo "  - zip alignment: **NO**"; ok=0; }
              else
                echo "- Android build-tools not found on runner: APK identity not checked"; ok=0
              fi
            done
            echo "- Source checks:"
            (cd .. && bash scripts/check-repo.sh >/tmp/check.txt 2>&1) && echo "  - repository checks and unit tests: passed" || { echo "  - repository checks and unit tests: **FAILED**"; ok=0; }
            echo
            [ "$ok" = 1 ] && echo "**Result: OK**" || echo "**Result: problems found**"
            echo "$ok" > /tmp/ok
          } | tee "$GITHUB_STEP_SUMMARY" report.md
          [ "$(cat /tmp/ok)" = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-report
          path: rel/report.md
